services:
  clipper:
    build:
      context: .
    image: stream-to-shorts:local
    init: true
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      YOUTUBE_CLIENT_SECRET_PATH: /run/secrets/client_secret.json
      YOUTUBE_TOKEN_PATH: /run/secrets/token.json
      HF_HOME: /data/models
    volumes:
      - ./input:/data/input:ro
      - ./clips:/data/clips
      - ./downloads:/data/downloads
      - ./live:/data/live
      - ./models:/data/models
      - ./secrets:/run/secrets
    command: ["--help"]
